<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAE 3D Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1220; --panel:#0f1a2e; --panel2:#14223b; --line:#22324f;
    --text:#e8eef8; --muted:#8fa3c2; --blue:#2f7bff; --orange:#ff8a1f;
    --green:#22c38e; --red:#ff5a6a; --yellow:#ffc53d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
  #scene{position:fixed;inset:0}
  canvas{display:block}

  /* Top bar */
  .topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;background:linear-gradient(180deg,rgba(11,18,32,.92),rgba(11,18,32,0));pointer-events:none;z-index:5}
  .brand{display:flex;align-items:center;gap:12px;pointer-events:auto}
  .brand .seal{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3b8cff,#0d3a8c);
    border:2px solid var(--orange);display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.5px}
  .brand .seal-img{width:40px;height:47px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
  .brand h1{font-size:16px;font-weight:700;line-height:1.1}
  .brand small{display:block;color:var(--muted);font-weight:500;font-size:12px}
  .chips{display:flex;gap:8px;pointer-events:auto}
  .chip{background:rgba(20,34,59,.85);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--text)}

  /* Hint */
  .hint{position:fixed;left:20px;bottom:20px;background:rgba(15,26,46,.88);border:1px solid var(--line);
    padding:12px 14px;border-radius:12px;font-size:12.5px;color:var(--muted);max-width:290px;z-index:5;line-height:1.5}
  .hint b{color:var(--text)}
  .legend{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .legend button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text);font-size:12.5px;padding:4px 6px;border-radius:6px}
  .legend button:hover{background:var(--panel2)}
  .dot{width:10px;height:10px;border-radius:3px}

  /* Tooltip */
  #tip{position:fixed;pointer-events:none;background:#fff;color:#0b1220;font-size:12px;font-weight:600;
    padding:6px 10px;border-radius:8px;transform:translate(-50%,-140%);opacity:0;transition:opacity .15s;z-index:6;white-space:nowrap}

  /* Panel */
  #panel{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--panel);
    border-left:1px solid var(--line);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);
    z-index:10;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.4)}
  #panel.open{transform:none}
  .p-head{padding:22px 22px 14px;border-bottom:1px solid var(--line);position:relative}
  .p-head .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    padding:4px 8px;border-radius:6px;margin-bottom:8px}
  .p-head h2{font-size:22px;font-weight:800}
  .p-head p{color:var(--muted);font-size:13px;margin-top:4px}
  .close{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:18px;cursor:pointer}
  .close:hover{border-color:var(--muted)}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:16px 22px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
  .kpi:hover,.kpi.active{border-color:var(--accent,var(--blue));transform:translateY(-1px)}
  .kpi .l{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .kpi .v{font-size:22px;font-weight:800;margin-top:4px}
  .kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
  .tabs{display:flex;gap:6px;padding:0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{all:unset;cursor:pointer;padding:10px 10px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
  .tab.active{color:var(--text);border-color:var(--accent,var(--blue))}
  .p-body{flex:1;overflow:auto;padding:18px 22px 28px}
  .p-body h3{font-size:14px;font-weight:700;margin:4px 0 10px}
  .bars{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
  .bar-row{display:grid;grid-template-columns:120px 1fr 74px;align-items:center;gap:10px;font-size:12.5px}
  .bar-row .n{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .track{height:10px;background:#0a1324;border-radius:6px;overflow:hidden}
  .fill{height:100%;border-radius:6px;width:0;transition:width .8s ease}
  .bar-row .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
  td{padding:9px 6px;border-bottom:1px solid #1a2843;font-variant-numeric:tabular-nums}
  .st{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px}
  .st.ok{background:rgba(34,195,142,.15);color:var(--green)}
  .st.warn{background:rgba(255,197,61,.15);color:var(--yellow)}
  .st.bad{background:rgba(255,90,106,.15);color:var(--red)}
  .note{margin-top:16px;font-size:11.5px;color:var(--muted);background:var(--panel2);border:1px dashed var(--line);padding:10px 12px;border-radius:10px}
  .credit{padding:10px 22px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}

  /* Loader */
  #loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20;transition:opacity .6s}
  #loader.hide{opacity:0;pointer-events:none}
  .spin{width:46px;height:46px;border:4px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}

  @media (max-width:720px){
    .chips{display:none}
    .hint{left:16px;right:16px;bottom:16px;max-width:none}
    #panel{top:auto;bottom:0;height:78%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%)}
    .bar-row{grid-template-columns:90px 1fr 64px}
  }
</style>
</head>
<body>
<div id="loader"><div class="spin"></div></div>
<div id="scene"></div>
<div id="tip"></div>

<div class="topbar">
  <div class="brand">
    <img class="seal-img" id="sealImg" alt="CAE">
    <div><h1>Centro de Aquisições Específicas</h1><small>UASG 120195 · Rio de Janeiro · Painel 3D</small></div>
  </div>
  <div class="chips">
    <div class="chip">Exercício <b>2026</b></div>

  </div>
</div>

<div class="hint">
  <b>Clique em um prédio</b> para abrir as informações da divisão. Arraste para girar, role para aproximar.
  <div class="legend">
    <button data-go="hq"><span class="dot" style="background:#ff8a1f"></span>Comando do CAE (visão geral)</button>
    <button data-go="contrato"><span class="dot" style="background:#2f7bff"></span>Divisão de Contrato</button>
    <button data-go="obtencao"><span class="dot" style="background:#22c38e"></span>Divisão de Obtenção</button>
    <button data-go="adm"><span class="dot" style="background:#a66bff"></span>Divisão Administrativa</button>
  </div>
</div>

<aside id="panel">
  <div class="p-head">
    <span class="tag" id="pTag"></span>
    <h2 id="pTitle"></h2>
    <p id="pSub"></p>
    <button class="close" id="pClose" aria-label="Fechar">×</button>
  </div>
  <div class="kpis" id="pKpis"></div>
  <div class="tabs" id="pTabs"></div>
  <div class="p-body" id="pBody"></div>
  <div class="credit"><span>Desenvolvido por <b>DomDevLabs</b></span><span>v1.7.0</span></div>
</aside>

<script>

/* =========================================================
   CENA 3D
   ========================================================= */
const wrap = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);
scene.fog = new THREE.Fog(0x0b1220, 80, 190);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(34, 26, 40);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0,2,0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI/2.15;
controls.minDistance = 12; controls.maxDistance = 90;

scene.add(new THREE.HemisphereLight(0xbcd3ff, 0x1a2233, 0.75));
const sun = new THREE.DirectionalLight(0xfff1dd, 1.1);
sun.position.set(30,45,20); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,near:1,far:120});
scene.add(sun);

/* ---------- helpers ---------- */
function canvasTex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=8; return t;
}
function facadeTex(base, cols, rows, lit){
  return canvasTex(512,256,(g,w,h)=>{
    g.fillStyle=base; g.fillRect(0,0,w,h);
    const pw=w/cols, ph=h/rows;
    for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
      const on=Math.random()<lit;
      g.fillStyle=on?'#ffd88a':'#26364f';
      g.fillRect(i*pw+pw*.22,j*ph+ph*.25,pw*.56,ph*.5);
    }
    g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(0,h-8,w,8);
  });
}
function label(text, color){
  const t=canvasTex(512,128,(g,w,h)=>{
    g.fillStyle='rgba(11,18,32,.88)';
    const r=30; g.beginPath(); g.moveTo(r,0); g.arcTo(w,0,w,h,r); g.arcTo(w,h,0,h,r); g.arcTo(0,h,0,0,r); g.arcTo(0,0,w,0,r); g.fill();
    g.fillStyle=color; g.fillRect(24,h/2-14,10,28);
    g.fillStyle='#fff'; g.font='700 44px Inter, sans-serif'; g.textBaseline='middle'; g.fillText(text,52,h/2+2);
  });
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true,sizeAttenuation:false}));
  s.scale.set(.15,.0375,1); s.renderOrder=10; return s;
}
function box(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=m.receiveShadow=true; return m; }

/* ---------- terreno ---------- */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(220,220), new THREE.MeshStandardMaterial({color:0x2b4a2f,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const patio = new THREE.Mesh(new THREE.PlaneGeometry(46,34), new THREE.MeshStandardMaterial({color:0x6d7483,roughness:.95}));
patio.rotation.x=-Math.PI/2; patio.position.set(0,0.02,2); patio.receiveShadow=true; scene.add(patio);

// pista
const runway = new THREE.Mesh(new THREE.PlaneGeometry(120,10), new THREE.MeshStandardMaterial({
  map:canvasTex(1024,96,(g,w,h)=>{g.fillStyle='#2a2e36';g.fillRect(0,0,w,h);g.fillStyle='#e9eef7';
    for(let x=10;x<w;x+=60)g.fillRect(x,h/2-3,34,6); g.fillRect(0,4,w,3); g.fillRect(0,h-7,w,3);}),
  roughness:.9}));
runway.rotation.x=-Math.PI/2; runway.position.set(0,0.03,-26); runway.receiveShadow=true; scene.add(runway);

// caminhos
const pathMat=new THREE.MeshStandardMaterial({color:0x9aa1ae,roughness:.9});
[[ -7,6,  -.65],[0,6,0],[7,6,.65]].forEach(([x,z,r])=>{
  const p=new THREE.Mesh(new THREE.PlaneGeometry(2.2,10),pathMat); p.rotation.x=-Math.PI/2; p.rotation.z=r;
  p.position.set(x,0.04,z); p.receiveShadow=true; scene.add(p);
});

// árvores
const trunkM=new THREE.MeshStandardMaterial({color:0x5a3d26}), leafM=new THREE.MeshStandardMaterial({color:0x2f7a3e,roughness:.8});
function tree(x,z,s=1){
  const g=new THREE.Group();
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.15*s,.2*s,1.2*s,6),trunkM); t.position.y=.6*s; t.castShadow=true;
  const l=new THREE.Mesh(new THREE.ConeGeometry(.9*s,2.2*s,7),leafM); l.position.y=2*s; l.castShadow=true;
  g.add(t,l); g.position.set(x,0,z); scene.add(g);
}

/* ---------- prédios ---------- */
const pickables=[]; const groups={};
function building(key,{w,h,d,color,accent,x,z,ry=0,floors=3,cols=8}){
  const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=ry;
  const fac=facadeTex(color,cols,floors,.55), facS=facadeTex(color,Math.max(3,Math.round(cols*d/w)),floors,.45);
  const plain=new THREE.MeshStandardMaterial({color:0xd9dde4,roughness:.8});
  const mats=[ new THREE.MeshStandardMaterial({map:facS,roughness:.8}), new THREE.MeshStandardMaterial({map:facS,roughness:.8}),
    plain, plain, new THREE.MeshStandardMaterial({map:fac,roughness:.8}), new THREE.MeshStandardMaterial({map:fac,roughness:.8}) ];
  const body=box(w,h,d,mats); body.position.y=h/2; g.add(body);
  // base / platibanda
  const base=box(w+.6,.4,d+.6,new THREE.MeshStandardMaterial({color:0x8d95a3})); base.position.y=.2; g.add(base);
  const roof=box(w+.4,.5,d+.4,new THREE.MeshStandardMaterial({color:new THREE.Color(accent),roughness:.6})); roof.position.y=h+.25; g.add(roof);
  // faixa de cor
  const band=box(w+.05,.35,d+.05,new THREE.MeshStandardMaterial({color:new THREE.Color(accent),emissive:new THREE.Color(accent),emissiveIntensity:.25}));
  band.position.y=h-.6; g.add(band);
  // entrada
  const door=box(2.2,2.4,.4,new THREE.MeshStandardMaterial({color:0x1b2638})); door.position.set(0,1.2,d/2+.1); g.add(door);
  const marq=box(4,.25,1.6,new THREE.MeshStandardMaterial({color:new THREE.Color(accent)})); marq.position.set(0,2.7,d/2+.8); g.add(marq);
  // marcador flutuante
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.9,.12,12,40),new THREE.MeshBasicMaterial({color:new THREE.Color(accent)}));
  const top=key==='hq'?h+5.6:h+2.3; // no Comando, acima do frontão
  ring.rotation.x=Math.PI/2; ring.position.y=top; g.add(ring);
  const lab=label(DATA[key].title.replace('Divisão de ','Div. ').replace('Divisão ','Div. '),accent); lab.position.y=top+1.1; g.add(lab);

  g.userData={key,ring,band,baseY:top};
  g.traverse(o=>{ if(o.isMesh) pickables.push(o); });
  scene.add(g); groups[key]=g; return g;
}

const MAST={x:-6.5,z:1,h:11.5,yardY:8.4,yardHalf:2.6};
(function mast(){
  const steel=new THREE.MeshStandardMaterial({color:0xcfd5de,metalness:.6,roughness:.3});
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.08,.12,MAST.h,10),steel); pole.position.set(MAST.x,MAST.h/2,MAST.z); pole.castShadow=true; scene.add(pole);
  const truck=new THREE.Mesh(new THREE.SphereGeometry(.16,12,8),new THREE.MeshStandardMaterial({color:0xd4af37,metalness:.8,roughness:.3})); truck.position.set(MAST.x,MAST.h+.1,MAST.z); scene.add(truck);
  const yard=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,MAST.yardHalf*2,8),steel); yard.rotation.z=Math.PI/2; yard.position.set(MAST.x,MAST.yardY,MAST.z); yard.castShadow=true; scene.add(yard);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.6,.75,.35,16),new THREE.MeshStandardMaterial({color:0x8d95a3})); base.position.set(MAST.x,.18,MAST.z); scene.add(base);
})();
function flagAt(x,y,flagDraw,cw=240,ch=160,w=2.4,h=1.6){
  const geo=new THREE.PlaneGeometry(w,h,12,1); geo.translate(w/2,-h/2,0); // pendurada pela tralha, canto superior
  const f=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:canvasTex(cw,ch,flagDraw),side:THREE.DoubleSide}));
  f.position.set(x,y,MAST.z); f.castShadow=true; scene.add(f); return f;
}

/* ---------- Gripen F-39 da FAB (low-poly) ---------- */
const roundelTex=canvasTex(128,128,(g,w,h)=>{ // cocar da FAB
  const c=w/2; g.fillStyle='#1f9a4a'; g.beginPath(); g.arc(c,c,62,0,7); g.fill();
  g.fillStyle='#ffd400'; g.beginPath(); g.arc(c,c,44,0,7); g.fill();
  g.fillStyle='#1f3d99'; g.beginPath(); g.arc(c,c,26,0,7); g.fill();
  g.fillStyle='#fff'; g.beginPath(); for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?7:18;g.lineTo(c+Math.cos(a)*r,c+Math.sin(a)*r);} g.closePath(); g.fill();
});
function flatShape(pts,depth,mat){
  const sh=new THREE.Shape(); sh.moveTo(pts[0][0],pts[0][1]); pts.slice(1).forEach(p=>sh.lineTo(p[0],p[1]));
  const geo=new THREE.ExtrudeGeometry(sh,{depth,bevelEnabled:false}); geo.translate(0,0,-depth/2);
  const m=new THREE.Mesh(geo,mat); m.castShadow=true; return m;
}
function gripen(){
  const g=new THREE.Group();
  const grey=new THREE.MeshStandardMaterial({color:0x7d8794,metalness:.35,roughness:.5});
  const dark=new THREE.MeshStandardMaterial({color:0x4a525c,metalness:.5,roughness:.4});
  const glass=new THREE.MeshStandardMaterial({color:0x1b2c44,metalness:.9,roughness:.08});
  // fuselagem (nariz para +x)
  const fus=new THREE.Mesh(new THREE.CylinderGeometry(.42,.5,8,16),grey); fus.rotation.z=Math.PI/2; g.add(fus);
  const nose=new THREE.Mesh(new THREE.ConeGeometry(.42,2.4,16),grey); nose.rotation.z=-Math.PI/2; nose.position.x=5.2; g.add(nose);
  const pitot=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.8,6),dark); pitot.rotation.z=Math.PI/2; pitot.position.x=6.7; g.add(pitot);
  const nozzle=new THREE.Mesh(new THREE.CylinderGeometry(.42,.36,.7,16,1,true),dark); nozzle.rotation.z=Math.PI/2; nozzle.position.x=-4.3; g.add(nozzle);
  // entradas de ar laterais
  [-1,1].forEach(sd=>{ const intake=new THREE.Mesh(new THREE.BoxGeometry(2.2,.55,.35),grey); intake.position.set(1.2,-.05,sd*.55); g.add(intake); });
  // canopi
  const can=new THREE.Mesh(new THREE.SphereGeometry(.42,16,10,0,Math.PI*2,0,Math.PI/2),glass); can.scale.set(2.6,1,1); can.position.set(2.8,.3,0); g.add(can);
  // asa delta (plano XZ)
  const wing=flatShape([[1.2,0],[-3.8,4.2],[-4.3,4.2],[-4.3,0]],.12,grey); wing.rotation.x=Math.PI/2; wing.position.y=-.15;
  const wingL=wing.clone(); wingL.scale.z=-1; g.add(wing, wingL);
  // canards
  const can1=flatShape([[3.4,0],[1.9,1.9],[1.5,1.9],[1.6,0]],.08,grey); can1.rotation.x=Math.PI/2; can1.position.y=.05;
  const can2=can1.clone(); can2.scale.z=-1; g.add(can1,can2);
  // deriva
  const fin=flatShape([[-1.6,0],[-3.9,2.5],[-4.5,2.5],[-4.3,0]],.1,grey); fin.position.y=.3; g.add(fin);
  // mísseis na ponta da asa
  [-1,1].forEach(sd=>{ const ms=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,2.2,8),new THREE.MeshStandardMaterial({color:0xe6e9ee})); ms.rotation.z=Math.PI/2; ms.position.set(-3.6,-.15,sd*4.3); g.add(ms); });
  // cocares da FAB sobre as asas
  [-1,1].forEach(sd=>{ const r=new THREE.Mesh(new THREE.CircleGeometry(.65,24),new THREE.MeshBasicMaterial({map:roundelTex})); r.rotation.x=-Math.PI/2; r.position.set(-2.6,-.08,sd*2.4); g.add(r); });
  // trem de pouso
  const gear=new THREE.Group();
  [[4,0],[-1.5,1.1],[-1.5,-1.1]].forEach(([x,z])=>{ const leg=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.7,6),dark); leg.position.set(x,-.7,z);
    const wh=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.15,12),new THREE.MeshStandardMaterial({color:0x111111})); wh.rotation.x=Math.PI/2; wh.position.set(x,-1.05,z); gear.add(leg,wh); });
  g.add(gear);
  // pós-combustor
  const ab=new THREE.Mesh(new THREE.ConeGeometry(.34,2.4,12),new THREE.MeshBasicMaterial({color:0xff9a3c,transparent:true,opacity:.85}));
  ab.rotation.z=Math.PI/2; ab.position.x=-5.8; ab.visible=false; g.add(ab);
  g.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  g.userData={gear,ab};
  return g;
}
const RWZ=-26, GEARY=1.27;
// pátio de estacionamento ao lado da pista
const apron=new THREE.Mesh(new THREE.PlaneGeometry(26,9),new THREE.MeshStandardMaterial({color:0x4c525d,roughness:.95}));
apron.rotation.x=-Math.PI/2; apron.position.set(-36,.025,-35.5); apron.receiveShadow=true; scene.add(apron);
[-44,-36,-28].forEach(x=>{ const p=gripen(); p.position.set(x,GEARY,-35.5); p.rotation.y=-Math.PI/2; scene.add(p); });

// ciclo de pouso e decolagem (mesma direção, +x)
const CYCLE=24;
const lerp=(a,b,k)=>a+(b-a)*k, clamp01=k=>Math.max(0,Math.min(1,k));
function landing(tt){ // 0..11 s
  if(tt<6){ const k=tt/6; return {x:lerp(-120,-35,k), y:lerp(26,GEARY,k*k*(3-2*k)), pitch:.08, ab:false}; }
  if(tt<12){ const k=(tt-6)/6, e=1-(1-k)*(1-k); return {x:lerp(-35,30,e), y:GEARY, pitch:.04*(1-k), ab:false}; }
  return null;
}
function takeoff(tt){
  if(tt<6){ const k=tt/6; return {x:lerp(-50,25,k*k), y:GEARY, pitch:0, ab:true}; }
  if(tt<12){ const k=(tt-6)/6; return {x:lerp(25,140,k), y:lerp(GEARY,34,k*k), pitch:.22*clamp01(k*3), ab:true}; }
  return null;
}
const flyers=[{m:gripen(),fn:landing,off:0},{m:gripen(),fn:takeoff,off:12}];
flyers.forEach(f=>{ f.m.position.z=RWZ; scene.add(f.m); });
function updateJets(t){
  flyers.forEach(f=>{
    const st=f.fn(((t+f.off)%CYCLE)); f.m.visible=!!st; if(!st) return;
    f.m.position.set(st.x,st.y,RWZ); f.m.rotation.z=st.pitch;
    f.m.userData.gear.visible=st.y<12;
    const ab=f.m.userData.ab; ab.visible=st.ab; if(st.ab){ ab.scale.set(1,.8+Math.random()*.4,1); }
  });
}

  // consoles e controladores dentro da cabine

  for(let i=0;i<3;i++){ const a=Math.PI/2+(i-1)*.7; const p=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(.35,.55,.45),new THREE.MeshStandardMaterial({color:0x9fc0ea})); body.position.y=15.6;
    const head=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),new THREE.MeshStandardMaterial({color:0xc8946a})); head.position.y=16.05;
    p.add(body,head); p.position.set(Math.cos(a)*1.6,0,Math.sin(a)*1.6); g.add(p); }
  // teto, antenas e farol
  const roof=new THREE.Mesh(new THREE.CylinderGeometry(3.3,3.1,.45,8),dark); roof.position.y=17.45; roof.castShadow=true; g.add(roof);
  const mast=new THREE.Mesh(new THREE.CylinderGeometry(.06,.08,3,6),new THREE.MeshStandardMaterial({color:0xcfd5de,metalness:.6})); mast.position.set(.8,19.2,0); g.add(mast);
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,1.6,6),new THREE.MeshStandardMaterial({color:0xcfd5de})); ant.position.set(-1,18.4,.6); g.add(ant);
  const beacon=new THREE.Mesh(new THREE.SphereGeometry(.18,10,8),new THREE.MeshBasicMaterial({color:0xff2a2a})); beacon.position.set(.8,20.8,0); g.add(beacon);
  const bl=new THREE.PointLight(0xff3030,0,14); bl.position.copy(beacon.position); g.add(bl);
  TWR.beacon=beacon; TWR.light=bl;
  // placa TWR
  const lab=label('TWR · Controle','#ff8a1f'); lab.position.y=22.3; g.add(lab);
  scene.add(g);
})();

  const feed=new THREE.Mesh(new THREE.BoxGeometry(.35,.3,.3),new THREE.MeshStandardMaterial({color:0xff8a1f})); feed.position.set(0,-.4,-1.8); dishG.add(feed);

  // radome secundário

  const lab=label('Radar','#2f7bff'); lab.position.y=H+5; g.add(lab);

/* ---------- militares da FAB fardados ---------- */
const UNI={shirt:0x9fc0ea, pants:0x203f86, cap:0x1c2f66, visor:0x0d0d0d, shoe:0x0a0a0a, belt:0x1c2f66, skin:[0xc8946a,0xe0b48c,0x8d5a3b,0xf1c9a5]};
function soldier(){
  const g=new THREE.Group(), M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
  const pants=M(UNI.pants), shirt=M(UNI.shirt), skin=M(UNI.skin[Math.floor(Math.random()*UNI.skin.length)]);
  const legs=[], arms=[];
  [-1,1].forEach(sd=>{
    const hip=new THREE.Group(); hip.position.set(0,.85,sd*.13);
    const leg=new THREE.Mesh(new THREE.BoxGeometry(.18,.82,.18),pants); leg.position.y=-.41; hip.add(leg);
    const shoe=new THREE.Mesh(new THREE.BoxGeometry(.28,.1,.19),M(UNI.shoe)); shoe.position.set(.05,-.82,0); hip.add(shoe);
    g.add(hip); legs.push(hip);
    const sh=new THREE.Group(); sh.position.set(0,1.45,sd*.32);
    // manga curta azul-clara + antebraço à mostra
    const sleeve=new THREE.Mesh(new THREE.BoxGeometry(.17,.3,.17),shirt); sleeve.position.y=-.14; sh.add(sleeve);
    const fore=new THREE.Mesh(new THREE.BoxGeometry(.12,.36,.12),skin); fore.position.y=-.46; sh.add(fore);
    const hand=new THREE.Mesh(new THREE.BoxGeometry(.12,.11,.12),skin); hand.position.y=-.68; sh.add(hand);
    g.add(sh); arms.push(sh);
  });
  const torso=new THREE.Mesh(new THREE.BoxGeometry(.32,.66,.56),shirt); torso.position.y=1.17; g.add(torso);
  const belt=new THREE.Mesh(new THREE.BoxGeometry(.34,.08,.58),M(UNI.belt)); belt.position.y=.87; g.add(belt);
  const buckle=new THREE.Mesh(new THREE.BoxGeometry(.03,.08,.12),new THREE.MeshStandardMaterial({color:0xcfc9b0,metalness:.8,roughness:.3})); buckle.position.set(.18,.87,0); g.add(buckle);
  // gola com camiseta branca, bolsos e asa no peito
  const tee=new THREE.Mesh(new THREE.BoxGeometry(.03,.1,.16),M(0xf4f4f4)); tee.position.set(.165,1.45,0); g.add(tee);
  const collar=new THREE.Mesh(new THREE.BoxGeometry(.3,.06,.34),shirt); collar.position.set(.02,1.53,0); g.add(collar);
  [-1,1].forEach(sd=>{ const pk=new THREE.Mesh(new THREE.BoxGeometry(.02,.16,.15),M(0xa9c2e3)); pk.position.set(.165,1.25,sd*.14); g.add(pk); });
  const wings=new THREE.Mesh(new THREE.BoxGeometry(.02,.03,.18),new THREE.MeshStandardMaterial({color:0xd8d8d8,metalness:.8,roughness:.3})); wings.position.set(.168,1.37,-.14); g.add(wings);
  // platinas
  [-1,1].forEach(sd=>{ const p=new THREE.Mesh(new THREE.BoxGeometry(.3,.04,.12),shirt); p.position.set(0,1.51,sd*.22); g.add(p); });
  const head=new THREE.Mesh(new THREE.SphereGeometry(.17,12,10),skin); head.position.y=1.72; g.add(head);
  // cobertura (quepe) com pala preta
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(.23,.18,.12,14),M(UNI.cap)); cap.position.y=1.9; g.add(cap);
  const band=new THREE.Mesh(new THREE.CylinderGeometry(.185,.185,.05,14),new THREE.MeshStandardMaterial({color:0xdfe3ea,metalness:.5,roughness:.4})); band.position.y=1.85; g.add(band);
  const visor=new THREE.Mesh(new THREE.BoxGeometry(.16,.03,.3),M(UNI.visor)); visor.position.set(.18,1.83,0); g.add(visor);
  const badge=new THREE.Mesh(new THREE.BoxGeometry(.02,.07,.07),new THREE.MeshStandardMaterial({color:0xd9dde3,metalness:.8,roughness:.3})); badge.position.set(.215,1.91,0); g.add(badge);
  g.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  g.scale.setScalar(1.05);
  g.userData={legs,arms,phase:Math.random()*6};
  return g;
}
// pontos de entrada de cada prédio (na frente da porta)
function frontOf(k,dist){ const g=groups[k]; return new THREE.Vector3(g.position.x+Math.sin(g.rotation.y)*dist,0,g.position.z+Math.cos(g.rotation.y)*dist); }
const SPOTS=[ new THREE.Vector3(0,0,2.6), frontOf('contrato',4.6), frontOf('obtencao',4.6), frontOf('adm',4.6) ];
const walkers=[];
for(let i=0;i<14;i++){
  const s=soldier(), from=SPOTS[i%4].clone().add(new THREE.Vector3((Math.random()-.5)*3,0,(Math.random()-.5)*3));
  s.position.copy(from); scene.add(s);
  walkers.push({m:s, target:null, wait:Math.random()*3, speed:1.2+Math.random()*.5});
}
function pickTarget(w){
  const cur=SPOTS.reduce((b,p)=>p.distanceTo(w.m.position)<b.distanceTo(w.m.position)?p:b);
  let dest; do{ dest=SPOTS[Math.floor(Math.random()*SPOTS.length)]; }while(dest===cur);
  w.target=dest.clone().add(new THREE.Vector3((Math.random()-.5)*2.4,0,(Math.random()-.5)*2.4));
}
function updateWalkers(dt,t){
  walkers.forEach(w=>{
    const u=w.m.userData;
    if(!w.target){ w.wait-=dt; if(w.wait<=0) pickTarget(w); u.legs.forEach(l=>l.rotation.z*=.8); u.arms.forEach(a=>a.rotation.z*=.8); return; }
    const d=w.target.clone().sub(w.m.position); d.y=0; const dist=d.length();
    if(dist<.15){ w.target=null; w.wait=1.5+Math.random()*4; return; }
    d.normalize(); w.m.position.addScaledVector(d,Math.min(dist,w.speed*dt));
    const yaw=Math.atan2(-d.z,d.x); // boneco olha para +x
    let diff=yaw-w.m.rotation.y; diff=Math.atan2(Math.sin(diff),Math.cos(diff)); w.m.rotation.y+=diff*.15;
    const sw=Math.sin(t*7*w.speed/1.4+u.phase)*.6;
    u.legs[0].rotation.z=sw; u.legs[1].rotation.z=-sw; u.arms[0].rotation.z=-sw*.8; u.arms[1].rotation.z=sw*.8;
  });
}

/* =========================================================
   INTERAÇÃO
   ========================================================= */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(), tip=document.getElementById('tip');
let hovered=null, selected=null;
const VIEWS={
  hq:{pos:[0,15,8],target:[0,7,-6]},

  home:{pos:[34,26,40],target:[0,2,0]}
};
function viewFor(k,side,d){ const g=groups[k], a=g.rotation.y+side;
  return {pos:[g.position.x+Math.sin(a)*d,9.5,g.position.z+Math.cos(a)*d], target:[g.position.x,4,g.position.z]}; }
VIEWS.contrato=viewFor('contrato',-.45,19); VIEWS.obtencao=viewFor('obtencao',.35,17); VIEWS.adm=viewFor('adm',.45,19);
let fly=null, viewShift={x:0,y:0}, viewShiftTo={x:0,y:0};
function targetShift(open){ const mob=innerWidth<=720; viewShiftTo= open ? (mob?{x:0,y:innerHeight*.3}:{x:Math.min(520,innerWidth)/2,y:0}) : {x:0,y:0}; }
function flyTo(v){ fly={fromP:camera.position.clone(),toP:new THREE.Vector3(...v.pos),fromT:controls.target.clone(),toT:new THREE.Vector3(...v.target),t:0}; }

function keyOf(obj){ while(obj){ if(obj.userData && obj.userData.key) return obj.userData.key; obj=obj.parent; } return null; }
function pick(e){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera); const hit=ray.intersectObjects(pickables,false)[0];
  return hit?keyOf(hit.object):null;
}
renderer.domElement.addEventListener('pointermove',e=>{
  const k=pick(e); hovered=k;
  document.body.style.cursor=k?'pointer':'default';
  if(k){ tip.textContent=DATA[k].title; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.style.opacity=1; }
  else tip.style.opacity=0;
});
let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>downAt=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6) return;
  const k=pick(e); if(k) openDivision(k);
});
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openDivision(b.dataset.go));

/* =========================================================
   PAINEL
   ========================================================= */
const panel=document.getElementById('panel');
function openDivision(key){
  selected=key; const d=DATA[key];
  flyTo(VIEWS[key]);
  panel.style.setProperty('--accent',d.color);
  const tag=document.getElementById('pTag'); tag.textContent=d.tag; tag.style.background=d.color+'26'; tag.style.color=d.color;
  document.getElementById('pTitle').textContent=d.title;
  document.getElementById('pSub').textContent=d.sub;
  document.getElementById('pKpis').innerHTML=d.kpis.map((k,i)=>`<div class="kpi" data-i="${i}"><div class="l">${k.l}</div><div class="v">${k.v}</div><div class="s">${k.s}</div></div>`).join('');
  document.getElementById('pTabs').innerHTML=d.tabs.map((t,i)=>`<button class="tab" data-i="${i}">${t.t}</button>`).join('');
  document.querySelectorAll('#pTabs .tab').forEach(b=>b.onclick=()=>showTab(+b.dataset.i));
  // KPI clica e abre aba correspondente (quando existir)
  document.querySelectorAll('#pKpis .kpi').forEach(c=>c.onclick=()=>{ const i=+c.dataset.i; if(d.tabs[i]) showTab(i); });
  showTab(0);
  panel.classList.add('open'); targetShift(true);
}
function showTab(i){
  const d=DATA[selected], t=d.tabs[i];
  document.querySelectorAll('#pTabs .tab').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.querySelectorAll('#pKpis .kpi').forEach((b,j)=>b.classList.toggle('active',j===i && d.tabs.length>1));
  let h='';
  if(t.bars){ h+=`<h3>${t.t}</h3><div class="bars">`+t.bars.map(([n,p,v])=>
    `<div class="bar-row"><span class="n" title="${n}">${n}</span><div class="track"><div class="fill" data-w="${p}" style="background:${d.color}"></div></div><span class="val">${v}</span></div>`).join('')+`</div>`; }
  if(t.table){ h+=`<h3>Detalhamento</h3><table><thead><tr>${t.table.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`+
    t.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')+`</tbody></table>`; }
  h+=`<div class="note">Dados de exemplo para visualização do layout. Na versão final, este painel será alimentado pelo Tesouro Gerencial, SIAFI e Comprasnet/PNCP.</div>`;
  const body=document.getElementById('pBody'); body.innerHTML=h;
  requestAnimationFrame(()=>body.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'));
}
document.getElementById('pClose').onclick=()=>{ panel.classList.remove('open'); selected=null; targetShift(false); flyTo(VIEWS.home); };
addEventListener('keydown',e=>{ if(e.key==='Escape') document.getElementById('pClose').click(); });
document.getElementById('upd').textContent=new Date().toLocaleDateString('pt-BR');

/* =========================================================
   LOOP
   ========================================================= */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.1), t=clock.elapsedTime;
  updateJets(t); updateWalkers(dt,t);
  TWR.radar.rotation.y+=dt*1.4;
  { const on=(t%1.4)<.35; TWR.beacon.material.color.setHex(on?0xff2a2a:0x551010); TWR.light.intensity=on?1.6:0; }
  Object.values(groups).forEach(g=>{
    const u=g.userData, active=(g.userData.key===hovered||g.userData.key===selected);
    u.ring.position.y=u.baseY+Math.sin(t*2+g.position.x)*.25;
    u.ring.rotation.z+=.02;
    u.ring.scale.setScalar(active?1.35:1);
    u.band.material.emissiveIntensity += ((active?1.1:.25)-u.band.material.emissiveIntensity)*.12;
  });
  flags.forEach((f,i)=>{ const p=f.geometry.attributes.position;
    for(let k=0;k<p.count;k++){ const x=p.getX(k); p.setZ(k,Math.sin(x*2.2-t*4+i)*.12*x/2.4); } p.needsUpdate=true; });
  if(fly){ fly.t=Math.min(1,fly.t+dt/1.2); const e=1-Math.pow(1-fly.t,3);
    camera.position.lerpVectors(fly.fromP,fly.toP,e); controls.target.lerpVectors(fly.fromT,fly.toT,e); if(fly.t>=1) fly=null; }
  viewShift.x+=(viewShiftTo.x-viewShift.x)*.1; viewShift.y+=(viewShiftTo.y-viewShift.y)*.1;
  if(Math.abs(viewShift.x)+Math.abs(viewShift.y)>.5) camera.setViewOffset(innerWidth,innerHeight,viewShift.x,viewShift.y,innerWidth,innerHeight); else camera.clearViewOffset();
  controls.update();
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); targetShift(!!selected); });
setTimeout(()=>document.getElementById('loader').classList.add('hide'),400);
</script>
