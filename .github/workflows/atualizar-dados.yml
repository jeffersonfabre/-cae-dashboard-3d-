name: Atualizar snapshot de reserva

# O site lê a planilha-banco ao vivo (botão "Atualizar" + leitura automática).
# Este fluxo é só MANUAL: regrava no index.html a cópia de reserva dos dados
# (usada se o Google estiver fora do ar) e publica uma nova versão.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ler a planilha pública e regenerar o snapshot
        id: gerar
        run: |
          node tools/gerar_snapshot.mjs --fetch --bump | tee "$RUNNER_TEMP/saida.txt"
          if grep -q '^MUDOU' "$RUNNER_TEMP/saida.txt"; then echo "mudou=true" >> "$GITHUB_OUTPUT"; fi
      - name: Publicar
        if: steps.gerar.outputs.mudou == 'true'
        run: |
          git config user.name "jeffersonfabre"
          git config user.email "jeffersonfabre@gmail.com"
          git add index.html sw.js README.md
          git commit -m "Atualiza snapshot de reserva da planilha-banco"
          git push
